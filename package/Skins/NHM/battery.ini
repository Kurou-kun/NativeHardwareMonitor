[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=NativeHardwareMonitor Example
Author=Kurou
Version=1.0.3
License=Creative Commons BY-NC-SA 4.0

[Variables]
plugin_name=NativeHardwareMonitor


;   WARNING
;
;   Plugin updates with skin update rate keep that in mind!
;
;
;   [Measure]
;   Measure=Plugin
;   Plugin=NativeHardwareMonitor
;   Category=Battery
;   Metric={value}  numeric: [ChargeLevel, Charging, AcOnline, TimeToEmpty, Rate,
;                             Voltage, RemainingCapacity, FullChargeCapacity,
;                             DesignCapacity, WearLevel, CycleCount]
;                   string:  [Status, Chemistry, Manufacturer, SerialNumber, DeviceName]
;   Debug={value}  [1, 0]
;
;   Always a single device (Device=0) — no Device= needed. On a desktop with no
;   battery, ChargeLevel/Charging/TimeToEmpty/Rate/capacities read -1 (unsupported);
;   AcOnline stays valid. CycleCount is often -1 (firmware rarely exposes it).
;
;   Units: Rate mW (signed, + charging / - discharging), Voltage mV,
;   *Capacity mWh, WearLevel/ChargeLevel %, TimeToEmpty seconds.


;   MEASURES
[Measure_ChargeLevel]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=chargelevel
Debug=2

[Measure_Status]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=status
Debug=2

[Measure_Charging]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=charging
Debug=2

[Measure_AcOnline]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=aconline
Debug=2

[Measure_TimeToEmpty]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=timetoempty
Debug=2

[Measure_Rate]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=rate
Debug=2

[Measure_Voltage]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=voltage
Debug=2

[Measure_RemainingCapacity]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=remainingcapacity
Debug=2

[Measure_FullChargeCapacity]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=fullchargecapacity
Debug=2

[Measure_DesignCapacity]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=designcapacity
Debug=2

[Measure_WearLevel]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=wearlevel
Debug=2

[Measure_CycleCount]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=cyclecount
Debug=2

[Measure_Chemistry]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=chemistry
Debug=2

[Measure_Manufacturer]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=manufacturer
Debug=2

[Measure_SerialNumber]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=serialnumber
Debug=2

[Measure_DeviceName]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=devicename
Debug=2


;   STYLES
[Text]
AntiAlias=1
FontColor=250, 250, 250, 255
FontSize=14
FontFace=Roboto


;   METERS
[Background]
