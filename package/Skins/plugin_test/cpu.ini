MeterStyle=Text
Text=CPU Voltage:
X=10
Y=5R

[Meter_Voltage_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_Voltage
StringAlign=Right
Text=%1
Postfix=" mV"
X=([Background:W] - 10)
Y=0r

[Meter_Name]
Meter=String
MeterStyle=Text
Text=Name:
X=10
Y=10R

[Meter_Name_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_Name
StringAlign=Left
FontSize=12
X=10
Y=2R

[Meter_Vendor]
