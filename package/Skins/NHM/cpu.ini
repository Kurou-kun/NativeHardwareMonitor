[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=NativeHardwareMonitor Cpu
Author=Kurou
Version=2.3.0
License=Creative Commons BY-NC-SA 4.0
Information=Every CPU metric the plugin exposes, for one core or the all-core total.


;   Every measure below is the same shape - category, metric, and which device:
;
;     [AnyName]
;     Measure=Plugin
;     Plugin=NativeHardwareMonitor
;     Category=CPU
;     Metric=usage
;
;   Debug=2 writes this device's readings to %TEMP%\NativeHardwareMonitor on every
;   update. That file is what a bug report should attach; drop the line for normal use.
;
;   A value of -1 means the metric is unsupported on this hardware. These reference
;   skins show it rather than hiding it, because that is the contract the wiki
;   documents. To hide it in a skin of your own, add
;
;     Substitute="-1":"n/a"
;
;   to the MEASURE - but not alongside AutoScale, which re-formats the number and
;   throws the substitution away (issue #14). Clocks below convert with a Calc for
;   exactly that reason: it keeps the sentinel and still reads in MHz.


[Variables]
scale=1
scale=1
device=0
color_background=10, 10, 10, 225
color_background_alt=25, 25, 25, 225
color_foreground=240, 240, 240, 255
color_foreground_alt=180, 180, 180, 255
color_accent=240, 0, 0, 225
font_family="Consolas"
font_size_s=10
font_size_m=12
font_size_l=14
plugin_name=NativeHardwareMonitor

;   Colors
color_background=10, 10, 10, 225
color_background_alt=25, 25, 25, 225
color_foreground=240, 240, 240, 255
color_foreground_alt=180, 180, 180, 255
color_accent=240, 0, 0, 225

;   Fonts. Consolas ships with Windows; swap in anything you like.
font_family="Consolas"
font_size_s=10
font_size_m=12
font_size_l=14


;   STYLES
[Style_Header]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_l# * #scale#)
StringAlign="Center"
StringCase="Upper"
StringStyle="Bold"
InlineSetting=CharacterSpacing | 1 | 1
ClipString=1
AntiAlias=1

[Style_Group]
FontFace=#font_family#
FontColor=#color_foreground_alt#
FontSize=(#font_size_s# * #scale#)
StringAlign="LeftCenter"
StringCase="Upper"
InlineSetting=CharacterSpacing | 1 | 1
ClipString=1
AntiAlias=1

[Style_Label]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_m# * #scale#)
StringAlign="Left"
ClipString=1
AntiAlias=1

[Style_Value]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_m# * #scale#)
StringAlign="Right"
ClipString=1
AntiAlias=1

[Style_Wide]
FontFace=#font_family#
FontColor=#color_foreground_alt#
FontSize=(#font_size_m# * #scale#)
StringAlign="Left"
ClipString=1
AntiAlias=1

;   MEASURES
[Measure_Usage]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=usage
Device=#device#
Debug=2

[Measure_Clock]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=clock
Device=#device#
Debug=2

[Measure_MaxClock]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=maxclock
Device=#device#
Debug=2

[Measure_Voltage]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=voltage
Device=#device#
Debug=2

[Measure_Name]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=name
Device=#device#
Debug=2

[Measure_Vendor]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=vendor
Device=#device#
Debug=2

[Measure_Identifier]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=identifier
Device=#device#
Debug=2

[Measure_MicrocodeVersion]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=microcodeversion
Device=#device#
Debug=2

[Measure_CoreCount]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=corecount
Device=#device#
Debug=2

[Measure_ThreadCount]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=threadcount
Device=#device#
Debug=2

[Measure_CacheL1]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=cachel1
Device=#device#
Debug=2

[Measure_CacheL2]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=cachel2
Device=#device#
Debug=2

[Measure_CacheL3]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=cachel3
Device=#device#
Debug=2

[Measure_Architecture]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=architecture
Device=#device#
Debug=2

;   Hz -> MHz, with the -1 sentinel surviving the conversion.
[Measure_Clock_MHz]
Measure=Calc
Formula=(Measure_Clock < 0 ? -1 : Round(Measure_Clock / 1000000))

[Measure_MaxClock_MHz]
Measure=Calc
Formula=(Measure_MaxClock < 0 ? -1 : Round(Measure_MaxClock / 1000000))


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background# | StrokeWidth 0
W=(340 * #scale#)
H=(525 * #scale#)
X=0
Y=0
AntiAlias=1
;   The Shape reads its own W/H back as section variables, so without this the
;   rectangle paints at whatever size it had last refresh.
DynamicVariables=1

    [Header]
    Meter=Shape
    Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background_alt# | StrokeWidth 0
    W=[Background:W]
    H=(25 * #scale#)
    X=0r
    Y=0r
    AntiAlias=1

        [Header_Title]
        Meter=String
        MeterStyle=Style_Header
        Text="processor"
        W=[Header:W]
        H=[Header:H]
        X=([Header:W] / 2)
        Y=0r


;   LOAD
[Group_load]
Meter=String
MeterStyle=Style_Group
Text="load"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Meter_Usage]
    Meter=String
    MeterStyle=Style_Label
    Text="usage"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_Usage_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Usage
        Text=%1
        NumOfDecimals=0
        Postfix=" %"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_Clock]
    Meter=String
    MeterStyle=Style_Label
    Text="clock"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_Clock_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Clock_MHz
        Text=%1
        NumOfDecimals=0
        Postfix=" MHz"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_MaxClock]
    Meter=String
    MeterStyle=Style_Label
    Text="max clock"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_MaxClock_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_MaxClock_MHz
        Text=%1
        NumOfDecimals=0
        Postfix=" MHz"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_Voltage]
    Meter=String
    MeterStyle=Style_Label
    Text="voltage"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_Voltage_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Voltage
        Text=%1
        NumOfDecimals=0
        Postfix=" mV"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

