;   Hz -> MHz, with the -1 sentinel surviving the conversion.
[Measure_Core_Clock_MHz]
Measure=Calc
Formula=(Measure_Core_Clock < 0 ? -1 : Round(Measure_Core_Clock / 1000000))

[Measure_Effective_Clock_MHz]
Measure=Calc
Formula=(Measure_Effective_Clock < 0 ? -1 : Round(Measure_Effective_Clock / 1000000))

[Measure_Memory_Clock_MHz]
Measure=Calc
Formula=(Measure_Memory_Clock < 0 ? -1 : Round(Measure_Memory_Clock / 1000000))

[Measure_MaxCoreClock_MHz]
Measure=Calc
Formula=(Measure_MaxCoreClock < 0 ? -1 : Round(Measure_MaxCoreClock / 1000000))


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background# | StrokeWidth 0
W=(340 * #scale#)
H=(953 * #scale#)
X=0
Y=0
AntiAlias=1
;   The Shape reads its own W/H back as section variables, so without this the
;   rectangle paints at whatever size it had last refresh.
DynamicVariables=1

    [Header]
    Meter=Shape
    Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background_alt# | StrokeWidth 0
    W=[Background:W]
    H=(25 * #scale#)
    X=0r
    Y=0r
    AntiAlias=1

        [Header_Title]
        Meter=String
        MeterStyle=Style_Header
        Text="graphics"
        W=[Header:W]
        H=[Header:H]
        X=([Header:W] / 2)
        Y=0r


