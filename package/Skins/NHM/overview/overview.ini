[Group_Disk]
Meter=String
MeterStyle=Style_Group
Text="storage"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Disk_Used]
    Meter=String
    MeterStyle=Style_Label
    MeasureName=Measure_Disk_Label
    Text=%1
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
