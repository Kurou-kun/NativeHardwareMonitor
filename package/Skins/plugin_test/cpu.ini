[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=NativeHardwareMonitor Example
Author=Kurou
Version=1.0.3
License=Creative Commons BY-NC-SA 4.0

[Variables]
plugin_name=NativeHardwareMonitor


;   WARNING
;
;   Plugin updates with skin update rate keep that in mind!
;
;
;   [Measure]
;   Measure=Plugin
;   Plugin=NativeHardwareMonitor
;   Category=CPU
;   Metric={value}  [Usage, Clock, MaxClock, Voltage, Name, Vendor, Identifier, MicrocodeVersion, CoreCount, ThreadCount, CacheL1, CacheL2, CacheL3, Architecture]
;   Device={value}  [0, 1, 2, etc] which is [total, core1, core2, etc]
;   Debug={value}  [1, 0]


;   MEASURES
[Measure_Usage]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=usage
Debug=2

[Measure_Clock]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=clock
Debug=2

[Measure_MaxClock]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=maxclock
Debug=2

[Measure_Voltage]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=voltage
Debug=2

[Measure_Name]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=name
Debug=2

[Measure_Vendor]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=vendor
Debug=2

[Measure_Identifier]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=identifier
Debug=2

[Measure_MicrocodeVersion]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=microcodeversion
Debug=2

[Measure_CoreCount]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=corecount
Debug=2

[Measure_ThreadCount]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=threadcount
Debug=2

[Measure_CacheL1]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=cachel1
Debug=2

[Measure_CacheL2]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=cachel2
Debug=2

[Measure_CacheL3]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=cachel3
Debug=2

[Measure_Architecture]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=architecture
Debug=2

;   STYLES
[Text]
AntiAlias=1
FontColor=250, 250, 250, 255
FontSize=14
FontFace=Roboto

;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0,0,[#CURRENTSECTION#:W],[#CURRENTSECTION#:H] | Fill Color 20, 20, 20, 255 | StrokeWidth 0
W=300
H=520
X=0
Y=0

[Title]
Meter=String
MeterStyle=Text
Text=NativeHardwareMonitor
StringAlign=Center
FontSize=16
X=([Background:W] / 2)
Y=5

[Meter_Usage]
Meter=String
MeterStyle=Text
Text=CPU Usage:
X=10
Y=5R

[Meter_Usage_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_Usage
StringAlign=Right
Text=%1
Postfix=" %"
X=([Background:W] - 10)
Y=0r

[Meter_Clock]
Meter=String
MeterStyle=Text
Text=CPU Clock:
X=10
Y=5R

[Meter_Clock_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_Clock
StringAlign=Right
Text=%1
Postfix="Hz"
AutoScale=2k
X=([Background:W] - 10)
Y=0r

[Meter_MaxClock]
Meter=String
MeterStyle=Text
Text=CPU Max Clock:
X=10
Y=5R

[Meter_MaxClock_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_MaxClock
StringAlign=Right
Text=%1
Postfix="Hz"
AutoScale=2k
X=([Background:W] - 10)
Y=0r

[Meter_Voltage]
