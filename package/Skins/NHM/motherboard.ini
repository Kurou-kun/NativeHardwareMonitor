[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=NativeHardwareMonitor Example
Author=Kurou
Version=1.0.3
License=Creative Commons BY-NC-SA 4.0

[Variables]
plugin_name=NativeHardwareMonitor


;   WARNING
;
;   Plugin updates with skin update rate keep that in mind!
;
;
;   [Measure]
;   Measure=Plugin
;   Plugin=NativeHardwareMonitor
;   Category=Motherboard
;   Metric={value}  string only: [Manufacturer, Product, SerialNumber,
;                                 BiosVersion, BiosDate, SystemManufacturer,
;                                 SystemProduct]
;   Debug={value}  [1, 0]
;
;   Single device (Device=0). All static strings read once at startup via WMI.
;   SerialNumber is often blank / "Default string" without admin rights — it
;   reports unsupported (String=) in that case.


;   MEASURES
[Measure_SystemManufacturer]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=systemmanufacturer
Debug=2

[Measure_SystemProduct]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=systemproduct
Debug=2

[Measure_Manufacturer]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=manufacturer
Debug=2

[Measure_Product]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=product
Debug=2

[Measure_BiosVersion]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=biosversion
Debug=2

[Measure_BiosDate]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=biosdate
Debug=2

[Measure_SerialNumber]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=serialnumber
Debug=2


;   STYLES
[Text]
AntiAlias=1
FontColor=250, 250, 250, 255
FontSize=14
FontFace=Roboto


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0,0,[#CURRENTSECTION#:W],[#CURRENTSECTION#:H] | Fill Color 20, 20, 20, 255 | StrokeWidth 0
W=500
H=320
X=0
Y=0

[Title]
Meter=String
MeterStyle=Text
Text=NativeHardwareMonitor
StringAlign=Center
FontSize=16
X=([Background:W] / 2)
Y=5

[Meter_SystemManufacturer]
Meter=String
MeterStyle=Text
Text=System Maker:
X=10
Y=5R

[Meter_SystemManufacturer_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_SystemManufacturer
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_SystemProduct]
Meter=String
MeterStyle=Text
Text=System Model:
X=10
Y=5R

[Meter_SystemProduct_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_SystemProduct
StringAlign=Left
FontSize=11
X=10
Y=2R

[Meter_Manufacturer]
Meter=String
MeterStyle=Text
Text=Board Maker:
X=10
Y=8R

[Meter_Manufacturer_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_Manufacturer
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_Product]
Meter=String
MeterStyle=Text
Text=Board Model:
X=10
Y=5R

[Meter_Product_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_Product
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_BiosVersion]
Meter=String
MeterStyle=Text
Text=BIOS Version:
X=10
Y=8R

[Meter_BiosVersion_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_BiosVersion
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_BiosDate]
Meter=String
MeterStyle=Text
Text=BIOS Date:
X=10
Y=5R

[Meter_BiosDate_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_BiosDate
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_SerialNumber]
Meter=String
MeterStyle=Text
Text=Board Serial:
X=10
Y=8R

[Meter_SerialNumber_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_SerialNumber
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r
