[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=NativeHardwareMonitor Battery
Author=Kurou
Version=2.3.1
License=Creative Commons BY-NC-SA 4.0
Information=Every battery metric the plugin exposes.


;   Every measure below is the same shape - category, metric, and which device:
;
;     [AnyName]
;     Measure=Plugin
;     Plugin=NativeHardwareMonitor
;     Category=Battery
;     Metric=chargelevel
;
;   Debug=2 writes this device's readings to %TEMP%\NativeHardwareMonitor on every
;   update. That file is what a bug report should attach; drop the line for normal use.
;
;   A value of -1 means the metric is unsupported on this hardware. These reference
;   skins show it rather than hiding it, because that is the contract the wiki
;   documents. To hide it in a skin of your own, add
;
;     Substitute="-1":"n/a"
;
;   to the MEASURE - but not alongside AutoScale, which re-formats the number and
;   throws the substitution away (issue #14). Clocks below convert with a Calc for
;   exactly that reason: it keeps the sentinel and still reads in MHz.


[Variables]
plugin_name=NativeHardwareMonitor

;   IMPORTS
;   Palette, fonts and the shared styles. Keep this LAST in [Variables] -
;   the include opens style sections, so anything after it lands in one.
@Include_Styles="#@#Styles.inc"


;   MEASURES
[Measure_ChargeLevel]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=chargelevel
Debug=2

[Measure_Status]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=status
Debug=2

[Measure_Charging]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=charging
Debug=2

[Measure_AcOnline]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=aconline
Debug=2

[Measure_TimeToEmpty]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=timetoempty
Debug=2

[Measure_Rate]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=rate
Debug=2

[Measure_Voltage]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=voltage
Debug=2

[Measure_RemainingCapacity]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=remainingcapacity
Debug=2

[Measure_FullChargeCapacity]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=fullchargecapacity
Debug=2

[Measure_DesignCapacity]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=designcapacity
Debug=2

[Measure_WearLevel]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=wearlevel
Debug=2

[Measure_CycleCount]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=cyclecount
Debug=2

[Measure_Chemistry]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=chemistry
Debug=2

[Measure_Manufacturer]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=manufacturer
Debug=2

[Measure_SerialNumber]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=serialnumber
Debug=2

[Measure_DeviceName]
Measure=Plugin
Plugin=#plugin_name#
Category=Battery
Metric=devicename
Debug=2


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background# | StrokeWidth 0
W=(340 * #scale#)
H=(517 * #scale#)
X=0
Y=0
AntiAlias=1
;   The Shape reads its own W/H back as section variables, so without this the
;   rectangle paints at whatever size it had last refresh.
DynamicVariables=1

    [Header]
    Meter=Shape
    Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background_alt# | StrokeWidth 0
    W=[Background:W]
    H=(25 * #scale#)
    X=0r
    Y=0r
    AntiAlias=1

        [Header_Title]
        Meter=String
        MeterStyle=Style_Header
        Text="battery"
        W=[Header:W]
        H=[Header:H]
        X=([Header:W] / 2)
        Y=0r


;   CHARGE
[Group_charge]
Meter=String
MeterStyle=Style_Group
Text="charge"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Meter_ChargeLevel]
    Meter=String
    MeterStyle=Style_Label
    Text="charge"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_ChargeLevel_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_ChargeLevel
        Text=%1
        NumOfDecimals=0
        Postfix=" %"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_Status]
