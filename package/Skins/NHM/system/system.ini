[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=NativeHardwareMonitor System
Author=Kurou
Version=2.3.1
License=Creative Commons BY-NC-SA 4.0
Information=Every system metric the plugin exposes - uptime, counts and OS identity.


;   Every measure below is the same shape - category, metric, and which device:
;
;     [AnyName]
;     Measure=Plugin
;     Plugin=NativeHardwareMonitor
;     Category=System
;     Metric=uptime
;
;   Debug=2 writes this device's readings to %TEMP%\NativeHardwareMonitor on every
;   update. That file is what a bug report should attach; drop the line for normal use.
;
;   A value of -1 means the metric is unsupported on this hardware. These reference
;   skins show it rather than hiding it, because that is the contract the wiki
;   documents. To hide it in a skin of your own, add
;
;     Substitute="-1":"n/a"
;
;   to the MEASURE - but not alongside AutoScale, which re-formats the number and
;   throws the substitution away (issue #14). Clocks below convert with a Calc for
;   exactly that reason: it keeps the sentinel and still reads in MHz.


[Variables]
plugin_name=NativeHardwareMonitor

;   IMPORTS
;   Palette, fonts and the shared styles. Keep this LAST in [Variables] -
;   the include opens style sections, so anything after it lands in one.
@Include_Styles="#@#Styles.inc"


;   MEASURES
[Measure_Uptime]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=uptime
Debug=2

[Measure_ProcessCount]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=processcount
Debug=2

[Measure_ThreadCount]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=threadcount
Debug=2

[Measure_HandleCount]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=handlecount
Debug=2

[Measure_OsName]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=osname
Debug=2

[Measure_OsVersion]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=osversion
Debug=2

[Measure_OsBuild]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=osbuild
Debug=2

[Measure_Hostname]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=hostname
Debug=2

[Measure_UserName]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=username
Debug=2

[Measure_BootTime]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=boottime
Debug=2


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background# | StrokeWidth 0
W=(380 * #scale#)
H=(355 * #scale#)
X=0
Y=0
AntiAlias=1
;   The Shape reads its own W/H back as section variables, so without this the
;   rectangle paints at whatever size it had last refresh.
DynamicVariables=1

    [Header]
    Meter=Shape
    Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background_alt# | StrokeWidth 0
    W=[Background:W]
    H=(25 * #scale#)
    X=0r
    Y=0r
    AntiAlias=1

        [Header_Title]
        Meter=String
        MeterStyle=Style_Header
        Text="system"
        W=[Header:W]
        H=[Header:H]
        X=([Header:W] / 2)
        Y=0r


;   RUNTIME
[Group_runtime]
Meter=String
MeterStyle=Style_Group
Text="runtime"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Meter_Uptime]
    Meter=String
    MeterStyle=Style_Label
    Text="uptime"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_Uptime_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Uptime
        Text=%1
        NumOfDecimals=0
        Postfix=" s"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_ProcessCount]
