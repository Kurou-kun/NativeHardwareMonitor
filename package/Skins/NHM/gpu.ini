;   STYLES
[Text]
AntiAlias=1
FontColor=250, 250, 250, 255
FontSize=14
FontFace=Roboto

;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0,0,[#CURRENTSECTION#:W],[#CURRENTSECTION#:H] | Fill Color 20, 20, 20, 255 | StrokeWidth 0
W=300
H=905
X=0
Y=0

[Title]
Meter=String
MeterStyle=Text
Text=NativeHardwareMonitor
StringAlign=Center
FontSize=16
X=([Background:W] / 2)
Y=5

[Meter_Usage]
Meter=String
MeterStyle=Text
Text=GPU Usage:
X=10
Y=5R

[Meter_Usage_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_Usage
StringAlign=Right
Text=%1
Postfix=" %"
X=([Background:W] - 10)
Y=0r

[Meter_Clock]
