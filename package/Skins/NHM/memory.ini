[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=NativeHardwareMonitor Memory
Author=Kurou
Version=2.3.0
License=Creative Commons BY-NC-SA 4.0
Information=Every memory metric the plugin exposes - physical RAM and the modules behind it.


;   Every measure below is the same shape - category, metric, and which device:
;
;     [AnyName]
;     Measure=Plugin
;     Plugin=NativeHardwareMonitor
;     Category=Memory
;     Metric=used
;
;   Debug=2 writes this device's readings to %TEMP%\NativeHardwareMonitor on every
;   update. That file is what a bug report should attach; drop the line for normal use.
;
;   A value of -1 means the metric is unsupported on this hardware. These reference
;   skins show it rather than hiding it, because that is the contract the wiki
;   documents. To hide it in a skin of your own, add
;
;     Substitute="-1":"n/a"
;
;   to the MEASURE - but not alongside AutoScale, which re-formats the number and
;   throws the substitution away (issue #14). Clocks below convert with a Calc for
;   exactly that reason: it keeps the sentinel and still reads in MHz.


[Variables]
scale=1
scale=1
color_background=10, 10, 10, 225
color_background_alt=25, 25, 25, 225
color_foreground=240, 240, 240, 255
color_foreground_alt=180, 180, 180, 255
color_accent=240, 0, 0, 225
font_family="Consolas"
font_size_s=10
font_size_m=12
font_size_l=14
plugin_name=NativeHardwareMonitor

;   Colors
color_background=10, 10, 10, 225
color_background_alt=25, 25, 25, 225
color_foreground=240, 240, 240, 255
color_foreground_alt=180, 180, 180, 255
color_accent=240, 0, 0, 225

;   Fonts. Consolas ships with Windows; swap in anything you like.
font_family="Consolas"
font_size_s=10
font_size_m=12
font_size_l=14


;   STYLES
[Style_Header]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_l# * #scale#)
StringAlign="Center"
StringCase="Upper"
StringStyle="Bold"
InlineSetting=CharacterSpacing | 1 | 1
ClipString=1
AntiAlias=1

[Style_Group]
FontFace=#font_family#
FontColor=#color_foreground_alt#
FontSize=(#font_size_s# * #scale#)
StringAlign="LeftCenter"
StringCase="Upper"
InlineSetting=CharacterSpacing | 1 | 1
ClipString=1
AntiAlias=1

[Style_Label]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_m# * #scale#)
StringAlign="Left"
ClipString=1
AntiAlias=1

[Style_Value]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_m# * #scale#)
StringAlign="Right"
ClipString=1
AntiAlias=1

[Style_Wide]
FontFace=#font_family#
FontColor=#color_foreground_alt#
FontSize=(#font_size_m# * #scale#)
StringAlign="Left"
ClipString=1
AntiAlias=1

;   MEASURES
[Measure_RAM_Used]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=used
Debug=2

[Measure_RAM_Free]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=free
Debug=2

[Measure_RAM_Total]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=total
Debug=2

[Measure_RAM_Percent]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=usedpercent
Debug=2

[Measure_RAM_Cached]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=cached
Debug=2

[Measure_RAM_Speed]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=speed
Debug=2

[Measure_RAM_Type]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=memorytype
Debug=2

[Measure_RAM_Manufacturer]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=manufacturer
Debug=2

[Measure_RAM_PartNumber]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=partnumber
Debug=2

[Measure_RAM_Modules]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=modulecount
Debug=2

[Measure_Virtual_Used]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=used
Device=1
Debug=2

[Measure_Virtual_Free]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=free
Device=1
Debug=2

[Measure_Virtual_Total]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=total
Device=1
Debug=2

[Measure_Virtual_Percent]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=usedpercent
Device=1
Debug=2

[Measure_Swap_Used]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=used
Device=2
Debug=2

[Measure_Swap_Free]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=free
Device=2
Debug=2

[Measure_Swap_Total]
Measure=Plugin
