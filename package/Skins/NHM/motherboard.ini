[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=NativeHardwareMonitor Motherboard
Author=Kurou
Version=2.3.0
License=Creative Commons BY-NC-SA 4.0
Information=Every motherboard and BIOS string the plugin exposes.


;   Every measure below is the same shape - category, metric, and which device:
;
;     [AnyName]
;     Measure=Plugin
;     Plugin=NativeHardwareMonitor
;     Category=Motherboard
;     Metric=systemmanufacturer
;
;   Debug=2 writes this device's readings to %TEMP%\NativeHardwareMonitor on every
;   update. That file is what a bug report should attach; drop the line for normal use.
;
;   A value of -1 means the metric is unsupported on this hardware. These reference
;   skins show it rather than hiding it, because that is the contract the wiki
;   documents. To hide it in a skin of your own, add
;
;     Substitute="-1":"n/a"
;
;   to the MEASURE - but not alongside AutoScale, which re-formats the number and
;   throws the substitution away (issue #14). Clocks below convert with a Calc for
;   exactly that reason: it keeps the sentinel and still reads in MHz.


[Variables]
scale=1
scale=1
color_background=10, 10, 10, 225
color_background_alt=25, 25, 25, 225
color_foreground=240, 240, 240, 255
color_foreground_alt=180, 180, 180, 255
color_accent=240, 0, 0, 225
font_family="Consolas"
font_size_s=10
font_size_m=12
font_size_l=14
plugin_name=NativeHardwareMonitor

;   Colors
color_background=10, 10, 10, 225
color_background_alt=25, 25, 25, 225
color_foreground=240, 240, 240, 255
color_foreground_alt=180, 180, 180, 255
color_accent=240, 0, 0, 225

;   Fonts. Consolas ships with Windows; swap in anything you like.
font_family="Consolas"
font_size_s=10
font_size_m=12
font_size_l=14


;   STYLES
[Style_Header]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_l# * #scale#)
StringAlign="Center"
StringCase="Upper"
StringStyle="Bold"
InlineSetting=CharacterSpacing | 1 | 1
ClipString=1
AntiAlias=1

[Style_Group]
FontFace=#font_family#
FontColor=#color_foreground_alt#
FontSize=(#font_size_s# * #scale#)
StringAlign="LeftCenter"
StringCase="Upper"
InlineSetting=CharacterSpacing | 1 | 1
ClipString=1
AntiAlias=1

[Style_Label]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_m# * #scale#)
StringAlign="Left"
ClipString=1
AntiAlias=1

[Style_Value]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_m# * #scale#)
StringAlign="Right"
ClipString=1
AntiAlias=1

[Style_Wide]
FontFace=#font_family#
FontColor=#color_foreground_alt#
FontSize=(#font_size_m# * #scale#)
StringAlign="Left"
ClipString=1
AntiAlias=1

;   MEASURES
[Measure_SystemManufacturer]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=systemmanufacturer
Debug=2

[Measure_SystemProduct]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=systemproduct
Debug=2

[Measure_Manufacturer]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=manufacturer
Debug=2

[Measure_Product]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=product
Debug=2

[Measure_BiosVersion]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=biosversion
Debug=2

[Measure_BiosDate]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=biosdate
Debug=2

[Measure_SerialNumber]
Measure=Plugin
Plugin=#plugin_name#
Category=Motherboard
Metric=serialnumber
Debug=2


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background# | StrokeWidth 0
W=(400 * #scale#)
H=(363 * #scale#)
X=0
Y=0
AntiAlias=1
;   The Shape reads its own W/H back as section variables, so without this the
;   rectangle paints at whatever size it had last refresh.
DynamicVariables=1

    [Header]
    Meter=Shape
    Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background_alt# | StrokeWidth 0
    W=[Background:W]
    H=(25 * #scale#)
    X=0r
    Y=0r
    AntiAlias=1

        [Header_Title]
        Meter=String
        MeterStyle=Style_Header
        Text="motherboard"
        W=[Header:W]
        H=[Header:H]
        X=([Header:W] / 2)
        Y=0r


;   SYSTEM
[Group_system]
Meter=String
MeterStyle=Style_Group
Text="system"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Meter_SystemManufacturer]
    Meter=String
    MeterStyle=Style_Label
    Text="system vendor"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_SystemManufacturer_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_SystemManufacturer
        Text=%1
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_SystemProduct]
    Meter=String
    MeterStyle=Style_Label
    Text="system"
    W=([Background:W] - (10 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_SystemProduct_Value]
        Meter=String
        MeterStyle=Style_Wide
        MeasureName=Measure_SystemProduct
        Text=%1
        W=([Background:W] - (10 * #scale#))
        H=(20 * #scale#)
        X=(5 * #scale#)
        Y=(2 * #scale#)R

;   BOARD
[Group_board]
Meter=String
MeterStyle=Style_Group
Text="board"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Meter_Manufacturer]
    Meter=String
    MeterStyle=Style_Label
    Text="manufacturer"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_Manufacturer_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Manufacturer
        Text=%1
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_Product]
    Meter=String
    MeterStyle=Style_Label
    Text="product"
    W=([Background:W] - (10 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_Product_Value]
        Meter=String
        MeterStyle=Style_Wide
        MeasureName=Measure_Product
        Text=%1
        W=([Background:W] - (10 * #scale#))
        H=(20 * #scale#)
        X=(5 * #scale#)
        Y=(2 * #scale#)R

    [Meter_SerialNumber]
    Meter=String
    MeterStyle=Style_Label
    Text="serial"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_SerialNumber_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_SerialNumber
        Text=%1
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

;   BIOS
[Group_bios]
Meter=String
MeterStyle=Style_Group
Text="bios"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Meter_BiosVersion]
    Meter=String
    MeterStyle=Style_Label
    Text="bios"
    W=([Background:W] - (10 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_BiosVersion_Value]
        Meter=String
        MeterStyle=Style_Wide
