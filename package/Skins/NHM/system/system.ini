        MeterStyle=Style_Value
        MeasureName=Measure_ProcessCount
        Text=%1
        NumOfDecimals=0
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_ThreadCount]
