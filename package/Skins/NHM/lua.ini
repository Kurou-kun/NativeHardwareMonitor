[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=NativeHardwareMonitor Lua
Author=Kurou
Version=2.3.0
License=Creative Commons BY-NC-SA 4.0
Information=Reading plugin values from a Lua script measure, and inline as section variables, next to the plain measure they should agree with.


;   Every measure below is the same shape - category, metric, and which device:
;
;     [AnyName]
;     Measure=Plugin
;     Plugin=NativeHardwareMonitor
;     Category=GPU
;     Metric=usage
;
;   Debug=2 writes this device's readings to %TEMP%\NativeHardwareMonitor on every
;   update. That file is what a bug report should attach; drop the line for normal use.
;
;   A value of -1 means the metric is unsupported on this hardware. These reference
;   skins show it rather than hiding it, because that is the contract the wiki
;   documents. To hide it in a skin of your own, add
;
;     Substitute="-1":"n/a"
;
;   to the MEASURE - but not alongside AutoScale, which re-formats the number and
;   throws the substitution away (issue #14). Clocks below convert with a Calc for
;   exactly that reason: it keeps the sentinel and still reads in MHz.


[Variables]
scale=1
plugin_name=NativeHardwareMonitor

;   Colors
color_background=10, 10, 10, 225
color_background_alt=25, 25, 25, 225
color_foreground=240, 240, 240, 255
color_foreground_alt=180, 180, 180, 255
color_accent=240, 0, 0, 225

;   Fonts. Consolas ships with Windows; swap in anything you like.
font_family="Consolas"
font_size_s=10
font_size_m=12
font_size_l=14


;   STYLES
[Style_Header]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_l# * #scale#)
StringAlign="Center"
StringCase="Upper"
StringStyle="Bold"
InlineSetting=CharacterSpacing | 1 | 1
ClipString=1
AntiAlias=1

[Style_Group]
FontFace=#font_family#
FontColor=#color_foreground_alt#
FontSize=(#font_size_s# * #scale#)
StringAlign="LeftCenter"
StringCase="Upper"
InlineSetting=CharacterSpacing | 1 | 1
ClipString=1
AntiAlias=1

[Style_Label]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_m# * #scale#)
StringAlign="Left"
ClipString=1
AntiAlias=1

[Style_Value]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_m# * #scale#)
StringAlign="Right"
ClipString=1
AntiAlias=1

[Style_Wide]
FontFace=#font_family#
FontColor=#color_foreground_alt#
FontSize=(#font_size_m# * #scale#)
StringAlign="Left"
ClipString=1
AntiAlias=1

;   MEASURES
[Measure_Usage]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=usage

[Measure_Name]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=name

[Measure_Voltage]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=voltage

;   HUB MEASURE - no Category at all, so it has no reading of its own. It exists
;   only so meters can ask it for any metric inline: [NHM:GPU(usage)].
[NHM]
Measure=Plugin
Plugin=#plugin_name#

;   LUA SCRIPT MEASURE - must come after the plugin measures so it reads values
;   that were gathered this update rather than last.
[MeasureLua]
Measure=Script
ScriptFile=lua_test.lua
UpdateDivider=1


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background# | StrokeWidth 0
W=(400 * #scale#)
H=(383 * #scale#)
X=0
Y=0
AntiAlias=1
;   The Shape reads its own W/H back as section variables, so without this the
;   rectangle paints at whatever size it had last refresh.
DynamicVariables=1

    [Header]
    Meter=Shape
    Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background_alt# | StrokeWidth 0
    W=[Background:W]
    H=(25 * #scale#)
    X=0r
    Y=0r
    AntiAlias=1

        [Header_Title]
        Meter=String
        MeterStyle=Style_Header
        Text="lua"
        W=[Header:W]
        H=[Header:H]
        X=([Header:W] / 2)
        Y=0r


;   MEASURE
[Group_measure]
Meter=String
MeterStyle=Style_Group
Text="measure"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Meter_UsageRaw]
    Meter=String
    MeterStyle=Style_Label
    Text="usage"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_UsageRaw_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Usage
        Text=%1
        NumOfDecimals=0
        Postfix=" %"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_VoltRaw]
    Meter=String
    MeterStyle=Style_Label
    Text="voltage"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_VoltRaw_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Voltage
        Text=%1
        NumOfDecimals=0
        Postfix=" mV"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_NameRaw]
    Meter=String
    MeterStyle=Style_Label
    Text="name"
    W=([Background:W] - (10 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_NameRaw_Value]
        Meter=String
        MeterStyle=Style_Wide
        MeasureName=Measure_Name
        Text=%1
        W=([Background:W] - (10 * #scale#))
        H=(20 * #scale#)
        X=(5 * #scale#)
        Y=(2 * #scale#)R

;   VIA LUA
[Group_via_lua]
Meter=String
MeterStyle=Style_Group
Text="via lua"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Meter_UsageLua]
    Meter=String
    MeterStyle=Style_Label
    Text="usage"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_UsageLua_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Usage
        Text=%1
        NumOfDecimals=0
        Postfix=" %"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_NameLua]
    Meter=String
    MeterStyle=Style_Label
    Text="name"
    W=([Background:W] - (10 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_NameLua_Value]
        Meter=String
        MeterStyle=Style_Wide
        MeasureName=MeasureLua
        Text=%1
        W=([Background:W] - (10 * #scale#))
        H=(20 * #scale#)
        X=(5 * #scale#)
        Y=(2 * #scale#)R

;   SECTION VARIABLE
[Group_section_variable]
Meter=String
MeterStyle=Style_Group
Text="section variable"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Meter_UsageSection]
    Meter=String
    MeterStyle=Style_Label
    Text="usage"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_UsageSection_Value]
        Meter=String
        MeterStyle=Style_Value
        Text=[NHM:GPU(usage)]
        NumOfDecimals=0
        Postfix=" %"
        DynamicVariables=1
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_NameSection]
    Meter=String
    MeterStyle=Style_Label
    Text="name"
    W=([Background:W] - (10 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_NameSection_Value]
        Meter=String
        MeterStyle=Style_Wide
        Text=[NHM:GPU(name)]
        DynamicVariables=1
        W=([Background:W] - (10 * #scale#))
        H=(20 * #scale#)
        X=(5 * #scale#)
        Y=(2 * #scale#)R

    [Meter_Note]
    Meter=String
    MeterStyle=Style_Wide
    Text="Lua-read values are printed to the log - open About to see them."
    W=([Background:W] - (10 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(8 * #scale#)R
