[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=NativeHardwareMonitor Example
Author=Kurou
Version=1.0.3
License=Creative Commons BY-NC-SA 4.0

[Variables]
plugin_name=NativeHardwareMonitor


;   WARNING
;
;   Plugin updates with skin update rate keep that in mind!
;
;
;   [Measure]
;   Measure=Plugin
;   Plugin=NativeHardwareMonitor
;   Category=Network
;   Metric={value}  [Upload, Download, UploadTotal, DownloadTotal, Speed, ReceiveLinkSpeed,
;                    PacketsReceived, PacketsSent, ErrorsReceived, ErrorsSent,
;                    DiscardsReceived, DiscardsSent, Mtu,
;                    Alias, Description, PhysicalAddress, ConnectionStatus]
;   Device={value}  [0, 1, 2, etc] which is [WiFi, Ethernet, etc]
;   Debug={value}  [1, 0]
;
;   [Measure] (Ping — separate Category, Device= is unused)
;   Measure=Plugin
;   Plugin=NativeHardwareMonitor
;   Category=Ping
;   Metric={value}  [Rtt, PacketLoss, MinRtt, MaxRtt, AvgRtt, Jitter, Ttl, PacketsSent, PacketsReceived, ResolvedIp, Status]
;   Host={value}  hostname or IP to ping (required)
;   PingInterval={value}  ms between pings for this host, default 1000
;   Debug={value}  [1, 0]


;   MEASURES
[Measure_Ping]
Measure=Plugin
Plugin=#plugin_name#
Category=Ping
Metric=rtt
Host=8.8.8.8
Debug=2

[Measure_PacketLoss]
Measure=Plugin
Plugin=#plugin_name#
Category=Ping
Metric=packetloss
Host=8.8.8.8
Debug=2

