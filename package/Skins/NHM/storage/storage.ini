[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=NativeHardwareMonitor Storage
Author=Kurou
Version=2.3.1
License=Creative Commons BY-NC-SA 4.0
Information=Every storage metric the plugin exposes, for one drive.


;   Every measure below is the same shape - category, metric, and which device:
;
;     [AnyName]
;     Measure=Plugin
;     Plugin=NativeHardwareMonitor
;     Category=Storage
;     Metric=totalspace
;
;   Debug=2 writes this device's readings to %TEMP%\NativeHardwareMonitor on every
;   update. That file is what a bug report should attach; drop the line for normal use.
;
;   A value of -1 means the metric is unsupported on this hardware. These reference
;   skins show it rather than hiding it, because that is the contract the wiki
;   documents. To hide it in a skin of your own, add
;
;     Substitute="-1":"n/a"
;
;   to the MEASURE - but not alongside AutoScale, which re-formats the number and
;   throws the substitution away (issue #14). Clocks below convert with a Calc for
;   exactly that reason: it keeps the sentinel and still reads in MHz.


[Variables]
drive=0
plugin_name=NativeHardwareMonitor

;   IMPORTS
;   Palette, fonts and the shared styles. Keep this LAST in [Variables] -
;   the include opens style sections, so anything after it lands in one.
@Include_Styles="#@#Styles.inc"


;   MEASURES
[Measure_Drive_1_Total]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=totalspace
Device=#drive#
Debug=2

[Measure_Drive_1_Used]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=usedspace
Device=#drive#
Debug=2

[Measure_Drive_1_Free]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=freespace
Device=#drive#
Debug=2

[Measure_Drive_1_Read_Speed]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=readspeed
Device=#drive#
Debug=2

[Measure_Drive_1_Write_Speed]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=writespeed
Device=#drive#
Debug=2

[Measure_Drive_1_Write_Bytes]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=writebytes
Device=#drive#
Debug=2

[Measure_Drive_1_Read_Bytes]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=readbytes
Device=#drive#
Debug=2

[Measure_Drive_1_Queue_Length]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=queuelength
Device=#drive#
Debug=2

[Measure_Drive_1_Busy_Percent]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=busypercent
Device=#drive#
Debug=2

[Measure_Drive_1_Reads_Per_Sec]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=readspersec
Device=#drive#
Debug=2

[Measure_Drive_1_Writes_Per_Sec]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=writespersec
Device=#drive#
Debug=2

[Measure_Drive_1_Volume_Label]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=volumelabel
Device=#drive#
Debug=2

[Measure_Drive_1_File_System]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=filesystem
Device=#drive#
Debug=2

[Measure_Drive_1_Drive_Type]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=drivetype
Device=#drive#
Debug=2


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background# | StrokeWidth 0
W=(340 * #scale#)
H=(481 * #scale#)
X=0
Y=0
AntiAlias=1
;   The Shape reads its own W/H back as section variables, so without this the
;   rectangle paints at whatever size it had last refresh.
DynamicVariables=1

    [Header]
    Meter=Shape
    Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background_alt# | StrokeWidth 0
    W=[Background:W]
    H=(25 * #scale#)
    X=0r
    Y=0r
    AntiAlias=1

        [Header_Title]
        Meter=String
        MeterStyle=Style_Header
        Text="storage"
        W=[Header:W]
        H=[Header:H]
        X=([Header:W] / 2)
        Y=0r


;   SPACE
[Group_space]
Meter=String
MeterStyle=Style_Group
Text="space"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Meter_Drive_1_Total]
    Meter=String
    MeterStyle=Style_Label
    Text="total"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_Drive_1_Total_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Drive_1_Total
        Text=%1
        AutoScale=1k
        NumOfDecimals=1
        Postfix="B"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_Drive_1_Used]
    Meter=String
    MeterStyle=Style_Label
    Text="used"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_Drive_1_Used_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Drive_1_Used
        Text=%1
        AutoScale=1k
        NumOfDecimals=1
        Postfix="B"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_Drive_1_Free]
