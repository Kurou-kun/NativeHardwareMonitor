    MeterStyle=Style_Label
    Text="processes"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_ProcessCount_Value]
