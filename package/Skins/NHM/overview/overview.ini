[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=NativeHardwareMonitor Overview
Author=Kurou
Version=2.3.1
License=Creative Commons BY-NC-SA 4.0
Information=The hardware worth seeing at a glance, read entirely through the NativeHardwareMonitor plugin. The other skins in this folder are per-category references for every metric the plugin exposes.


;   Every measure below is the same four lines:
;
;     [AnyName]
;     Measure=Plugin
;     Plugin=NativeHardwareMonitor
;     Category=CPU        ; GPU, CPU, Memory, Network, Storage, Ping, Battery,
;                         ; System, Motherboard, Display
;     Metric=usage        ; see the per-category skins in this folder
;     Device=0            ; which GPU, which drive, which NIC
;
;   MinValue/MaxValue are Rainmeter's, not the plugin's - a Bar meter needs them.
;   Values come in raw base units (Hz, bytes, bytes/second), so scaling stays in
;   the skin: AutoScale for bytes, AutoScale=2k for Hz.


[Variables]
gpu=0
nic=0
disk=0

;   IMPORTS
;   Palette, fonts and the shared styles. Keep this LAST in [Variables] -
;   the include opens style sections, so anything after it lands in one.
@Include_Styles="#@#Styles.inc"


;   MEASURES
[Measure_Cpu_Usage]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=CPU
Metric=usage
MinValue=0
MaxValue=100

[Measure_Cpu_Clock]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=CPU
Metric=clock

[Measure_Ram_Percent]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=Memory
Metric=usedpercent
MinValue=0
MaxValue=100

[Measure_Ram_Used]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=Memory
Metric=used

[Measure_Ram_Total]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=Memory
Metric=total

[Measure_Gpu_Name]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=GPU
Metric=name
Device=#gpu#

[Measure_Gpu_Usage]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=GPU
Metric=usage
Device=#gpu#
MinValue=0
MaxValue=100

[Measure_Gpu_Temperature]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=GPU
Metric=temperature
Device=#gpu#
;   -1 means the card does not report it, which is not a number worth showing.
RegExpSubstitute=1
Substitute="^-1(\.0+)?$":"n/a"

[Measure_Gpu_Vram_Used]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=GPU
Metric=vramused
Device=#gpu#

[Measure_Gpu_Vram_Total]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=GPU
Metric=vramtotal
Device=#gpu#

[Measure_Net_Download]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=Network
Metric=download
Device=#nic#

[Measure_Net_Upload]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=Network
Metric=upload
Device=#nic#

[Measure_Disk_Label]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=Storage
Metric=label
Device=#disk#

[Measure_Disk_Used]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=Storage
Metric=usedspace
Device=#disk#
;   Storage reports sizes, not a percentage, so the bar gets its range from the
;   total instead - which is a section variable, hence DynamicVariables.
MinValue=0
MaxValue=[Measure_Disk_Total]
DynamicVariables=1

[Measure_Disk_Total]
Measure=Plugin
Plugin=NativeHardwareMonitor
Category=Storage
Metric=totalspace
Device=#disk#

;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background# | StrokeWidth 0
W=(350 * #scale#)
H=(465 * #scale#)
X=0
Y=0
AntiAlias=1
;   The Shape reads its own W/H back as section variables, so without this the
;   rectangle paints at whatever size it had last refresh.
DynamicVariables=1

    [Header]
    Meter=Shape
    Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background_alt# | StrokeWidth 0
    W=[Background:W]
    H=(25 * #scale#)
    X=0r
    Y=0r
    AntiAlias=1

        [Header_Title]
        Meter=String
        MeterStyle=Style_Header
        Text="hardware"
        W=[Header:W]
        H=[Header:H]
        X=([Header:W] / 2)
        Y=0r


;   PROCESSOR
[Group_Cpu]
Meter=String
MeterStyle=Style_Group
Text="processor"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Cpu_Usage]
    Meter=String
    MeterStyle=Style_Label
    Text="usage"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Cpu_Usage_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Cpu_Usage
        Text=%1
        NumOfDecimals=0
        Postfix=" %"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

        [Cpu_Usage_Bar_Background]
        Meter=Shape
        MeterStyle=Style_Bar_Background

            [Cpu_Usage_Bar]
            Meter=Bar
            MeterStyle=Style_Bar
            MeasureName=Measure_Cpu_Usage

    [Cpu_Clock]
    Meter=String
    MeterStyle=Style_Label
    Text="clock"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Cpu_Clock_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Cpu_Clock
        Text=%1
        AutoScale=2k
        NumOfDecimals=2
        Postfix="Hz"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r


;   MEMORY
[Group_Ram]
Meter=String
MeterStyle=Style_Group
Text="memory"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Ram_Used]
    Meter=String
    MeterStyle=Style_Label
    Text="used"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Ram_Used_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Ram_Used
        MeasureName2=Measure_Ram_Total
        Text="%1B / %2B"
        AutoScale=1k
        NumOfDecimals=1
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

        [Ram_Bar_Background]
        Meter=Shape
        MeterStyle=Style_Bar_Background

            [Ram_Bar]
            Meter=Bar
            MeterStyle=Style_Bar
            MeasureName=Measure_Ram_Percent


;   GRAPHICS
[Group_Gpu]
Meter=String
MeterStyle=Style_Group
Text="graphics"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Gpu_Name]
    Meter=String
    MeterStyle=Style_Label
    MeasureName=Measure_Gpu_Name
    Text=%1
    FontColor=#color_foreground_alt#
    W=([Background:W] - (10 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

    [Gpu_Usage]
    Meter=String
    MeterStyle=Style_Label
    Text="usage"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Gpu_Usage_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Gpu_Usage
        Text=%1
        NumOfDecimals=0
        Postfix=" %"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

        [Gpu_Usage_Bar_Background]
        Meter=Shape
        MeterStyle=Style_Bar_Background

            [Gpu_Usage_Bar]
            Meter=Bar
            MeterStyle=Style_Bar
            MeasureName=Measure_Gpu_Usage

    [Gpu_Temperature]
    Meter=String
    MeterStyle=Style_Label
    Text="temperature"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Gpu_Temperature_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Gpu_Temperature
        Text=%1
        NumOfDecimals=0
        Postfix=" C"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Gpu_Vram]
    Meter=String
    MeterStyle=Style_Label
    Text="memory"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Gpu_Vram_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Gpu_Vram_Used
        MeasureName2=Measure_Gpu_Vram_Total
        Text="%1B / %2B"
        AutoScale=1k
        NumOfDecimals=1
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r


;   NETWORK
[Group_Net]
Meter=String
MeterStyle=Style_Group
Text="network"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Net_Download]
    Meter=String
    MeterStyle=Style_Label
    Text="download"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Net_Download_Value]
