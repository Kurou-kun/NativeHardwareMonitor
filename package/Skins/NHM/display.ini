[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=NativeHardwareMonitor Display
Author=Kurou
Version=2.3.0
License=Creative Commons BY-NC-SA 4.0
Information=Every display metric the plugin exposes, for each attached monitor.


;   Every measure below is the same shape - category, metric, and which device:
;
;     [AnyName]
;     Measure=Plugin
;     Plugin=NativeHardwareMonitor
;     Category=Display
;     Metric=count
;
;   Debug=2 writes this device's readings to %TEMP%\NativeHardwareMonitor on every
;   update. That file is what a bug report should attach; drop the line for normal use.
;
;   A value of -1 means the metric is unsupported on this hardware. These reference
;   skins show it rather than hiding it, because that is the contract the wiki
;   documents. To hide it in a skin of your own, add
;
;     Substitute="-1":"n/a"
;
;   to the MEASURE - but not alongside AutoScale, which re-formats the number and
;   throws the substitution away (issue #14). Clocks below convert with a Calc for
;   exactly that reason: it keeps the sentinel and still reads in MHz.


[Variables]
scale=1
scale=1
color_background=10, 10, 10, 225
color_background_alt=25, 25, 25, 225
color_foreground=240, 240, 240, 255
color_foreground_alt=180, 180, 180, 255
color_accent=240, 0, 0, 225
font_family="Consolas"
font_size_s=10
font_size_m=12
font_size_l=14
plugin_name=NativeHardwareMonitor

;   Colors
color_background=10, 10, 10, 225
color_background_alt=25, 25, 25, 225
color_foreground=240, 240, 240, 255
color_foreground_alt=180, 180, 180, 255
color_accent=240, 0, 0, 225

;   Fonts. Consolas ships with Windows; swap in anything you like.
font_family="Consolas"
font_size_s=10
font_size_m=12
font_size_l=14


;   STYLES
[Style_Header]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_l# * #scale#)
StringAlign="Center"
StringCase="Upper"
StringStyle="Bold"
InlineSetting=CharacterSpacing | 1 | 1
ClipString=1
AntiAlias=1

[Style_Group]
FontFace=#font_family#
FontColor=#color_foreground_alt#
FontSize=(#font_size_s# * #scale#)
StringAlign="LeftCenter"
StringCase="Upper"
InlineSetting=CharacterSpacing | 1 | 1
ClipString=1
AntiAlias=1

[Style_Label]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_m# * #scale#)
StringAlign="Left"
ClipString=1
AntiAlias=1

[Style_Value]
FontFace=#font_family#
FontColor=#color_foreground#
FontSize=(#font_size_m# * #scale#)
StringAlign="Right"
ClipString=1
AntiAlias=1

[Style_Wide]
FontFace=#font_family#
FontColor=#color_foreground_alt#
FontSize=(#font_size_m# * #scale#)
StringAlign="Left"
ClipString=1
AntiAlias=1

;   MEASURES
[Measure_Count]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=count
Debug=2

[Measure_0_Name]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=name
Device=0
Debug=2

[Measure_0_Resolution]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=resolution
Device=0
Debug=2

[Measure_0_Refresh]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=refreshrate
Device=0
Debug=2

[Measure_0_Bpp]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=bitsperpixel
Device=0
Debug=2

[Measure_0_Primary]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=primary
Device=0
Debug=2

[Measure_0_DeviceName]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=devicename
Device=0
Debug=2

[Measure_1_Name]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=name
Device=1
Debug=2

[Measure_1_Resolution]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=resolution
Device=1
Debug=2

[Measure_1_Refresh]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=refreshrate
Device=1
Debug=2

[Measure_1_Primary]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=primary
Device=1
Debug=2


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background# | StrokeWidth 0
W=(380 * #scale#)
H=(435 * #scale#)
X=0
Y=0
AntiAlias=1
;   The Shape reads its own W/H back as section variables, so without this the
;   rectangle paints at whatever size it had last refresh.
DynamicVariables=1

    [Header]
    Meter=Shape
    Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background_alt# | StrokeWidth 0
    W=[Background:W]
    H=(25 * #scale#)
    X=0r
    Y=0r
    AntiAlias=1

        [Header_Title]
        Meter=String
        MeterStyle=Style_Header
        Text="display"
        W=[Header:W]
        H=[Header:H]
        X=([Header:W] / 2)
        Y=0r


;   DISPLAYS
[Group_displays]
Meter=String
MeterStyle=Style_Group
Text="displays"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Meter_Count]
    Meter=String
    MeterStyle=Style_Label
    Text="count"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_Count_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Count
        Text=%1
        NumOfDecimals=0
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

    [Meter_0_Name]
    Meter=String
    MeterStyle=Style_Label
    Text="0 name"
    W=([Background:W] - (10 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_0_Name_Value]
