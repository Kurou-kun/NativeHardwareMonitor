[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=NativeHardwareMonitor Example
Author=Kurou
Version=1.0.3
License=Creative Commons BY-NC-SA 4.0

[Variables]
plugin_name=NativeHardwareMonitor
; which CPU core - 0 is the first core, and the LAST index is the total across all of them every measure below reads. Change it, save, refresh the skin.
device=0


;   WARNING
;
;   Plugin updates with skin update rate keep that in mind!
;
;
;   [Measure]
;   Measure=Plugin
;   Plugin=NativeHardwareMonitor
;   Category=CPU
;   Metric={value}  [Usage, Clock, MaxClock, Voltage, Name, Vendor, Identifier, MicrocodeVersion, CoreCount, ThreadCount, CacheL1, CacheL2, CacheL3, Architecture]
;   Device={value}  [0, 1, 2, etc] which is [total, core1, core2, etc]
;   Debug={value}  [1, 0]


;   MEASURES
[Measure_Usage]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=usage
Device=#device#
Debug=2

; Clocks are published in Hz and shown in MHz, which is what MSI Afterburner,
; GPU-Z and HWiNFO all report. AutoScale cannot do it: it gives one decimal, so
; above 1 GHz it rounds 1750 and 1800 MHz to the same "1.8 GHz". The Calc
; measures below do the conversion; their < 0 branch keeps the unsupported
; sentinel visible instead of rounding -1 Hz away to 0.
[Measure_Clock]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=clock
Device=#device#
Debug=2

[Measure_Clock_MHz]
Measure=Calc
Formula=(Measure_Clock < 0 ? -1 : Round(Measure_Clock / 1000000))

[Measure_MaxClock]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=maxclock
Device=#device#
Debug=2

[Measure_MaxClock_MHz]
Measure=Calc
Formula=(Measure_MaxClock < 0 ? -1 : Round(Measure_MaxClock / 1000000))

[Measure_Voltage]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=voltage
Device=#device#
Debug=2

[Measure_Name]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=name
Device=#device#
Debug=2

[Measure_Vendor]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=vendor
Device=#device#
Debug=2

[Measure_Identifier]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=identifier
Device=#device#
Debug=2

[Measure_MicrocodeVersion]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=microcodeversion
Device=#device#
Debug=2

[Measure_CoreCount]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=corecount
Device=#device#
Debug=2

[Measure_ThreadCount]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=threadcount
Device=#device#
Debug=2

[Measure_CacheL1]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=cachel1
Device=#device#
Debug=2

[Measure_CacheL2]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=cachel2
Device=#device#
Debug=2

[Measure_CacheL3]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=cachel3
Device=#device#
Debug=2

[Measure_Architecture]
Measure=Plugin
Plugin=#plugin_name#
Category=CPU
Metric=architecture
Device=#device#
Debug=2

;   STYLES
[Text]
AntiAlias=1
FontColor=250, 250, 250, 255
FontSize=14
FontFace=Roboto

;   METERS
[Background]
