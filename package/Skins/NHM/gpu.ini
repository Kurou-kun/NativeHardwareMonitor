[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=NativeHardwareMonitor Example
Author=Kurou
Version=1.0.3
License=Creative Commons BY-NC-SA 4.0

[Variables]
plugin_name=NativeHardwareMonitor
; which GPU every measure below reads. Change it, save, refresh the skin.
device=0


;   WARNING
;   
;   Plugin updates with skin update rate keep that in mind!
;
;
;   [Measure]
;   Measure=Plugin
;   Plugin=NativeHardwareMonitor
;   Category=GPU
;   Metric={value}  [Usage, CoreClock, EffectiveClock, MemoryClock, Temperature, HotspotTemperature, MemoryTemperature, VramUsed, VramTotal, FanSpeed, FanSpeedRPM, Power, PowerLimit, Voltage, IntakeTemperature, TotalBoardPower, MaxCoreClock, PcieLinkGen, PcieLinkWidth, EncoderUsage, DecoderUsage, PerfState, Name, DriverVersion, VbiosVersion, PciDeviceId, ThrottleReasons]
;   Device={value}  [0, 1, 2, etc] which is [IGPU, AMD, NVIDIA, etc]
;   Debug={value}  [1, 0]


;   MEASURES
[Measure_Usage]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=usage
Device=#device#
Debug=2

[Measure_Core_Clock]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=coreclock
Device=#device#
Debug=2

