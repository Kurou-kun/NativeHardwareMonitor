[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=NativeHardwareMonitor Example
Author=Kurou
Version=1.0.3
License=Creative Commons BY-NC-SA 4.0

[Variables]
plugin_name=NativeHardwareMonitor
drive=0


;   WARNING
;
;   Plugin updates with skin update rate keep that in mind!
;
;
;   [Measure]
;   Measure=Plugin
;   Plugin=NativeHardwareMonitor
;   Category=Storage
;   Metric={value}  [ReadBytes, WriteBytes, ReadSpeed, WriteSpeed, UsedSpace, FreeSpace,
;                    TotalSpace, QueueLength, BusyPercent, ReadsPerSec, WritesPerSec,
;                    VolumeLabel, FileSystem, DriveType]
;   Device={value}  [0, 1, 2, etc] which is [drive0, drive1, etc]
;   Debug={value}  [1, 0]


;   MEASURES
[Measure_Drive_1_Total]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=totalspace
Device=#drive#
Debug=2

[Measure_Drive_1_Used]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=usedspace
Device=#drive#
Debug=2

[Measure_Drive_1_Free]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=freespace
Device=#drive#
Debug=2

[Measure_Drive_1_Read_Speed]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=readspeed
Device=#drive#
Debug=2

[Measure_Drive_1_Write_Speed]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=writespeed
Device=#drive#
Debug=2

[Measure_Drive_1_Write_Bytes]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=writebytes
Device=#drive#
Debug=2

[Measure_Drive_1_Read_Bytes]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=readbytes
Device=#drive#
Debug=2

[Measure_Drive_1_Queue_Length]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=queuelength
Device=#drive#
Debug=2

[Measure_Drive_1_Busy_Percent]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=busypercent
Device=#drive#
Debug=2

[Measure_Drive_1_Reads_Per_Sec]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=readspersec
Device=#drive#
Debug=2

[Measure_Drive_1_Writes_Per_Sec]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=writespersec
Device=#drive#
Debug=2

[Measure_Drive_1_Volume_Label]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=volumelabel
Device=#drive#
Debug=2

[Measure_Drive_1_File_System]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=filesystem
Device=#drive#
Debug=2

[Measure_Drive_1_Drive_Type]
Measure=Plugin
Plugin=#plugin_name#
Category=Storage
Metric=drivetype
Device=#drive#
Debug=2



;   STYLES
[Text]
AntiAlias=1
FontColor=250, 250, 250, 255
FontSize=14
FontFace=Roboto

;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0,0,[#CURRENTSECTION#:W],[#CURRENTSECTION#:H] | Fill Color 20, 20, 20, 255 | StrokeWidth 0
W=250
H=470
X=0
Y=0

[Title]
Meter=String
MeterStyle=Text
Text=NativeHardwareMonitor
StringAlign=Center
FontSize=16
X=([Background:W] / 2)
Y=5

[Meter_Drive_1_Total]
Meter=String
MeterStyle=Text
Text=Drive Total:
X=10
Y=5R

[Meter_Drive_1_Total_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_Drive_1_Total
StringAlign=Right
Text=%1
Postfix="B"
X=([Background:W] - 10)
Y=0r
AutoScale=1k

