[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=NativeHardwareMonitor Example
Author=Kurou
Version=1.0.3
License=Creative Commons BY-NC-SA 4.0

[Variables]
plugin_name=NativeHardwareMonitor


;   WARNING
;
;   Plugin updates with skin update rate keep that in mind!
;
;
;   [Measure]
;   Measure=Plugin
;   Plugin=NativeHardwareMonitor
;   Category=System
;   Metric={value}  numeric: [Uptime (s), ProcessCount, ThreadCount, HandleCount]
;                   string:  [OsName, OsVersion, OsBuild, Hostname, UserName, BootTime]
;   Debug={value}  [1, 0]
;
;   Single device (Device=0). Uptime is raw seconds — format it in the skin
;   (e.g. a Time-style calc). OsName/OsVersion/OsBuild come from WMI; the rest
;   from Win32. BootTime is a fixed "YYYY-MM-DD HH:MM:SS" local timestamp.


;   MEASURES
[Measure_Uptime]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=uptime
Debug=2

[Measure_ProcessCount]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=processcount
Debug=2

[Measure_ThreadCount]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=threadcount
Debug=2

[Measure_HandleCount]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=handlecount
Debug=2

[Measure_OsName]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=osname
Debug=2

[Measure_OsVersion]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=osversion
Debug=2

[Measure_OsBuild]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=osbuild
Debug=2

[Measure_Hostname]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=hostname
Debug=2

[Measure_UserName]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=username
Debug=2

[Measure_BootTime]
Measure=Plugin
Plugin=#plugin_name#
Category=System
Metric=boottime
Debug=2


;   STYLES
[Text]
AntiAlias=1
FontColor=250, 250, 250, 255
FontSize=14
FontFace=Roboto


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0,0,[#CURRENTSECTION#:W],[#CURRENTSECTION#:H] | Fill Color 20, 20, 20, 255 | StrokeWidth 0
W=350
H=360
X=0
Y=0

[Title]
Meter=String
MeterStyle=Text
Text=NativeHardwareMonitor
StringAlign=Center
FontSize=16
X=([Background:W] / 2)
Y=5

[Meter_Uptime]
Meter=String
MeterStyle=Text
Text=Uptime:
X=10
Y=5R

[Meter_Uptime_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_Uptime
StringAlign=Right
Text=%1
Postfix=" s"
X=([Background:W] - 10)
Y=0r

[Meter_BootTime]
Meter=String
MeterStyle=Text
Text=Boot Time:
X=10
Y=5R

[Meter_BootTime_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_BootTime
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_ProcessCount]
Meter=String
MeterStyle=Text
Text=Processes:
X=10
Y=5R

[Meter_ProcessCount_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_ProcessCount
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_ThreadCount]
Meter=String
MeterStyle=Text
Text=Threads:
X=10
Y=5R

[Meter_ThreadCount_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_ThreadCount
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_HandleCount]
Meter=String
MeterStyle=Text
Text=Handles:
X=10
Y=5R

[Meter_HandleCount_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_HandleCount
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_OsName]
Meter=String
MeterStyle=Text
Text=OS:
X=10
Y=10R

[Meter_OsName_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_OsName
StringAlign=Left
FontSize=11
X=10
Y=2R

[Meter_OsVersion]
Meter=String
MeterStyle=Text
Text=Version:
X=10
Y=5R

[Meter_OsVersion_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_OsVersion
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_OsBuild]
Meter=String
MeterStyle=Text
Text=Build:
X=10
Y=5R

[Meter_OsBuild_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_OsBuild
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_Hostname]
