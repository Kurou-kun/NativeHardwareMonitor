[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=NativeHardwareMonitor Section Variables
Author=Kurou
Version=2.2.8
License=Creative Commons BY-NC-SA 4.0

[Variables]
plugin_name=NativeHardwareMonitor
device=0


;   SECTION VARIABLES
;
;   [NHM:<Category>(<Metric>, <Device>)] reads any metric through one measure.
;   Device is optional and defaults to 0. Metric accepts the same names and
;   aliases as Metric= on a measure.
;
;   [NHM:GPU(temp)]  [NHM:GPU(name, 1)]  [NHM:CPU(usage)]  [NHM:GPU(count)]
;   [NHM:GPU(provider)]
;
;   Numbers print with up to three decimals, trailing zeros trimmed. A third
;   argument sets the decimals instead - [NHM:CPU(usage,,0)] rounds to a whole
;   number on device 0. A fourth scales the value: `auto` is Rainmeter's own
;   AutoScale=1 (`auto1000` is =2), and anything else is a divisor, with the
;   leading slash optional - [NHM:GPU(vramused,,1,auto)], [NHM:CPU(clock,,0,/1000000)].
;
;   Both exist because Rainmeter's formatting CANNOT reach a section variable
;   that calls a plugin: NumOfDecimals and AutoScale act on a measure's value,
;   and [NHM:GPU(vramused):/1048576] is not valid syntax - Rainmeter hands the
;   whole `GPU(...)` selector to the plugin and substitutes whatever string
;   comes back. A negative value is never scaled, so -1 stays -1.
;
;   One function per category: GPU, CPU, Memory, Network, Storage, Ping,
;   Battery, System, Motherboard, Display.
;
;   Meter and measure OPTIONS need DynamicVariables=1 to re-resolve them.
;   ACTIONS do not - see the scroll actions on [Background] below.
;
;   This skin reads every metric twice, once per path, so the two value
;   columns must agree. A row where they disagree is a bug.


;   HUB MEASURE
;
;   No Category= at all: this measure has no reading of its own (it stays at 0)
;   and exists only to host the section variables above.
[NHM]
Measure=Plugin
Plugin=#plugin_name#


;   CLASSIC MEASURES (the same metrics the one-measure-per-metric way)
[Measure_Usage]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=usage
Device=#device#
DynamicVariables=1

[Measure_Temperature]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=temperature
Device=#device#
DynamicVariables=1

[Measure_VramUsed]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=vramused
Device=#device#
DynamicVariables=1

[Measure_Name]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=name
Device=#device#
DynamicVariables=1

[Measure_Count]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=count

[Measure_ProviderStatus]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=providerstatus


;   STYLES
[Text]
AntiAlias=1
FontColor=250, 250, 250, 255
FontSize=13
FontFace=Roboto

[TextLabel]
MeterStyle=Text
X=10

[TextMeasure]
MeterStyle=Text
StringAlign=Right
X=250
Y=0r

[TextSection]
MeterStyle=Text
StringAlign=Right
FontColor=130, 210, 255, 255
X=([Background:W] - 10)
Y=0r
DynamicVariables=1


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0,0,[#CURRENTSECTION#:W],[#CURRENTSECTION#:H] | Fill Color 20, 20, 20, 255 | StrokeWidth 0
W=400
H=275
X=0
Y=0
; Section variables in ACTIONS resolve without DynamicVariables=1 - only the
; #device# variable here needs it. Clamping against [NHM:GPU(count)] is why the
; device count is worth exposing: no hard-coded maximum.
;
; The Max(0, ...) matters. If count is ever 0 - and it is, for the moment before
; the first gather lands - then "count - 1" is -1, Clamp(x, 0, -1) returns -1, and
; the skin asks for a device that cannot exist. Never let a count feed a clamp
; bound without flooring it.
MouseScrollUpAction=[!SetVariable device "(Clamp(#device# + 1, 0, Max(0, [NHM:GPU(count)] - 1)))"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
MouseScrollDownAction=[!SetVariable device "(Clamp(#device# - 1, 0, Max(0, [NHM:GPU(count)] - 1)))"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
DynamicVariables=1

[Title]
Meter=String
MeterStyle=Text
Text=Section Variables
StringAlign=Center
FontSize=16
X=([Background:W] / 2)
Y=5

[Subtitle]
Meter=String
MeterStyle=Text
Text=scroll to change GPU device
StringAlign=Center
FontSize=10
FontColor=160, 160, 160, 255
X=([Background:W] / 2)
Y=3R


;   --- HEADER ROW ---
[Header_Metric]
Meter=String
MeterStyle=TextLabel
Text=GPU device #device#
FontSize=11
FontColor=160, 160, 160, 255
Y=12R
DynamicVariables=1

[Header_Measure]
Meter=String
MeterStyle=TextMeasure
Text=measure
FontSize=11
FontColor=160, 160, 160, 255

[Header_Section]
Meter=String
MeterStyle=TextSection
Text=[NHM:...]
FontSize=11
FontColor=160, 160, 160, 255


;   --- COUNT : the one metric every category answers ---
[Label_Count]
Meter=String
MeterStyle=TextLabel
Text=count
Y=10R

[Value_CountMeasure]
Meter=String
MeterStyle=TextMeasure
MeasureName=Measure_Count
Text=%1

[Value_CountSection]
Meter=String
MeterStyle=TextSection
Text=[NHM:GPU(count)]


;   --- PROVIDERSTATUS : reserved in every category too. 1 gathering, 0 not up yet,
;   -1 no provider on this machine. This is what tells a skin whether a -1 elsewhere
;   means "sensor absent" or "no driver installed" - show a message, not a number.
[Label_ProviderStatus]
Meter=String
MeterStyle=TextLabel
Text=provider
Y=6R

[Value_ProviderStatusMeasure]
Meter=String
MeterStyle=TextMeasure
MeasureName=Measure_ProviderStatus
Text=%1

[Value_ProviderStatusSection]
Meter=String
MeterStyle=TextSection
Text=[NHM:GPU(provider)]


;   --- USAGE ---
[Label_Usage]
Meter=String
MeterStyle=TextLabel
Text=usage
Y=6R

[Value_UsageMeasure]
Meter=String
MeterStyle=TextMeasure
MeasureName=Measure_Usage
Text=%1
NumOfDecimals=1

[Value_UsageSection]
Meter=String
MeterStyle=TextSection
Text=[NHM:GPU(usage, #device#)]


;   --- TEMPERATURE ---
[Label_Temperature]
Meter=String
MeterStyle=TextLabel
Text=temperature
Y=6R

[Value_TemperatureMeasure]
Meter=String
MeterStyle=TextMeasure
MeasureName=Measure_Temperature
Text=%1
NumOfDecimals=1

[Value_TemperatureSection]
Meter=String
MeterStyle=TextSection
Text=[NHM:GPU(temp, #device#)]


;   --- VRAM USED : a big number, checks the value is not printed in exponent form ---
[Label_VramUsed]
Meter=String
MeterStyle=TextLabel
Text=vramused
Y=6R

[Value_VramUsedMeasure]
Meter=String
MeterStyle=TextMeasure
MeasureName=Measure_VramUsed
Text=%1

[Value_VramUsedSection]
Meter=String
MeterStyle=TextSection
Text=[NHM:GPU(vramused, #device#)]


;   --- VRAM USED, SCALED : the same metric through the fourth argument. The measure
;   column uses AutoScale=1 and the section column uses `auto`; they must print the
;   same text, because `auto` is a copy of Rainmeter's own scaling.
[Label_VramScaled]
Meter=String
MeterStyle=TextLabel
Text=vramused (scaled)
Y=6R

[Value_VramScaledMeasure]
Meter=String
MeterStyle=TextMeasure
MeasureName=Measure_VramUsed
Text=%1B
AutoScale=1
NumOfDecimals=1

[Value_VramScaledSection]
Meter=String
MeterStyle=TextSection
Text=[NHM:GPU(vramused, #device#, 1, auto)]B


;   --- NAME : a string metric, not a number ---
[Label_Name]
Meter=String
MeterStyle=TextLabel
Text=name
Y=6R

[Value_NameMeasure]
Meter=String
MeterStyle=TextMeasure
MeasureName=Measure_Name
FontSize=10
Text=%1

[Value_NameSection]
Meter=String
MeterStyle=TextSection
FontSize=10
Text=[NHM:GPU(name, #device#)]


;   --- OTHER CATEGORIES : no extra measures needed for any of these ---
[Label_Others]
Meter=String
MeterStyle=TextLabel
Text=cpu / memory / displays
FontSize=11
FontColor=160, 160, 160, 255
Y=12R

[Value_Others]
Meter=String
MeterStyle=TextSection
FontSize=11
Text=[NHM:CPU(usage,,0)] % / [NHM:Memory(usedpercent,,0)] % / [NHM:Display(count)]
