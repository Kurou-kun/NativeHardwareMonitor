name: Build and Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativeHardwareMonitor
          path: build/Release/NativeHardwareMonitor.dll

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NativeHardwareMonitor Build ${{ github.run_number }}
          files: build/Release/NativeHardwareMonitor.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}