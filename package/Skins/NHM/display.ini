[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=NativeHardwareMonitor Example
Author=Kurou
Version=1.0.3
License=Creative Commons BY-NC-SA 4.0

[Variables]
plugin_name=NativeHardwareMonitor


;   WARNING
;
;   Plugin updates with skin update rate keep that in mind!
;
;
;   [Measure]
;   Measure=Plugin
;   Plugin=NativeHardwareMonitor
;   Category=Display
;   Metric={value}  numeric: [Width, Height, RefreshRate, BitsPerPixel, Primary, Count]
;                   string:  [Name, DeviceName, Resolution]
;   Device={value}  0-based monitor index (0, 1, 2, ...)
;   Debug={value}  [1, 0]
;
;   Multi-device: one device per active monitor. Count is the total and reads
;   the same on every device. Width/Height/RefreshRate are live (a resolution
;   change is picked up); monitor hotplug is NOT (device list is fixed at load).


;   MEASURES
[Measure_Count]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=count
Debug=2

;   --- Monitor 0 ---
[Measure_0_Name]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=name
Device=0
Debug=2

[Measure_0_Resolution]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=resolution
Device=0
Debug=2

[Measure_0_Refresh]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=refreshrate
Device=0
Debug=2

[Measure_0_Bpp]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=bitsperpixel
Device=0
Debug=2

[Measure_0_Primary]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=primary
Device=0
Debug=2

[Measure_0_DeviceName]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=devicename
Device=0
Debug=2

;   --- Monitor 1 (blank if only one monitor) ---
[Measure_1_Name]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=name
Device=1
Debug=2

[Measure_1_Resolution]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=resolution
Device=1
Debug=2

[Measure_1_Refresh]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=refreshrate
Device=1
Debug=2

[Measure_1_Primary]
Measure=Plugin
Plugin=#plugin_name#
Category=Display
Metric=primary
Device=1
Debug=2


;   STYLES
[Text]
AntiAlias=1
FontColor=250, 250, 250, 255
FontSize=14
FontFace=Roboto


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0,0,[#CURRENTSECTION#:W],[#CURRENTSECTION#:H] | Fill Color 20, 20, 20, 255 | StrokeWidth 0
W=400
H=380
X=0
Y=0

[Title]
Meter=String
MeterStyle=Text
Text=NativeHardwareMonitor
StringAlign=Center
FontSize=16
X=([Background:W] / 2)
Y=5

[Meter_Count]
Meter=String
MeterStyle=Text
Text=Monitors:
X=10
Y=8R

[Meter_Count_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_Count
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_0_Header]
Meter=String
MeterStyle=Text
Text=Monitor 0
FontSize=13
FontColor=140, 200, 255, 255
X=10
Y=12R

[Meter_0_Name]
Meter=String
MeterStyle=Text
MeasureName=Measure_0_Name
Text=%1
StringAlign=Left
FontSize=11
X=10
Y=2R

[Meter_0_Resolution]
Meter=String
MeterStyle=Text
Text=Resolution:
X=10
Y=5R

[Meter_0_Resolution_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_0_Resolution
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_0_Refresh]
Meter=String
MeterStyle=Text
Text=Refresh:
X=10
Y=5R

[Meter_0_Refresh_Value]
Meter=String
MeterStyle=Text
MeasureName=Measure_0_Refresh
StringAlign=Right
Text=%1
Postfix=" Hz"
X=([Background:W] - 10)
Y=0r

[Meter_0_Bpp]
