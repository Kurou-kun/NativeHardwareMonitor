[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=NativeHardwareMonitor Lua Verify
Author=Kurou
Version=1.0.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
plugin_name=NativeHardwareMonitor

;   NHM PLUGIN MEASURES (the source the Lua script reads)
[Measure_Usage]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=usage

[Measure_Name]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=name

[Measure_Voltage]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=voltage

;   HUB MEASURE (section variables: one measure, any metric - see lua_test.lua)
;   No Category= at all, so it has no reading of its own.
[NHM]
Measure=Plugin
Plugin=#plugin_name#

;   LUA SCRIPT MEASURE (must come after the plugin measures so it reads fresh values)
[MeasureLua]
Measure=Script
ScriptFile=lua_test.lua
UpdateDivider=1

;   STYLES
[Text]
AntiAlias=1
FontColor=250, 250, 250, 255
FontSize=14
FontFace=Roboto

;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0,0,[#CURRENTSECTION#:W],[#CURRENTSECTION#:H] | Fill Color 20, 20, 20, 255 | StrokeWidth 0
W=400
H=375
X=0
Y=0

[Title]
Meter=String
MeterStyle=Text
Text=Lua Read-Path Verify
StringAlign=Center
FontSize=16
X=([Background:W] / 2)
Y=5

;   --- USAGE (number) : raw plugin vs. Lua-read ---
[Meter_UsageRawLabel]
Meter=String
MeterStyle=Text
Text=usage (raw plugin):
X=10
Y=15R

[Meter_UsageRawValue]
Meter=String
MeterStyle=Text
MeasureName=Measure_Usage
StringAlign=Right
Text=%1
Postfix=" %"
X=([Background:W] - 10)
Y=0r

[Meter_UsageLuaLabel]
Meter=String
MeterStyle=Text
Text=usage (via Lua):
X=10
Y=5R

[Meter_UsageLuaValue]
Meter=String
MeterStyle=Text
MeasureName=Measure_Usage
StringAlign=Right
Text=%1
Postfix=" %"
X=([Background:W] - 10)
Y=0r

;   --- NAME (string) : raw plugin vs. Lua-read ---
[Meter_NameRawLabel]
Meter=String
MeterStyle=Text
Text=name (raw plugin):
X=10
Y=15R

[Meter_NameRawValue]
Meter=String
MeterStyle=Text
MeasureName=Measure_Name
StringAlign=Right
FontSize=11
Text=%1
X=([Background:W] - 10)
Y=0r

[Meter_NameLuaLabel]
Meter=String
MeterStyle=Text
Text=name (via Lua):
X=10
Y=8R

[Meter_NameLuaValue]
Meter=String
MeterStyle=Text
; Script measure string value = 2nd return of Update()
MeasureName=MeasureLua
StringAlign=Right
FontSize=11
Text=%1
X=([Background:W] - 10)
Y=0r

;   --- VOLTAGE : sentinel (-1 unsupported) survives into Lua ---
[Meter_VoltRawLabel]
Meter=String
MeterStyle=Text
Text=voltage sentinel (raw):
X=10
Y=15R

[Meter_VoltRawValue]
Meter=String
MeterStyle=Text
MeasureName=Measure_Voltage
StringAlign=Right
Text=%1
X=([Background:W] - 10)
Y=0r

;   --- SAME TWO VALUES VIA SECTION VARIABLES, NO MEASURE OF THEIR OWN ---
[Meter_UsageSectionLabel]
Meter=String
MeterStyle=Text
Text=usage (section variable):
X=10
Y=15R

[Meter_UsageSectionValue]
Meter=String
MeterStyle=Text
StringAlign=Right
Text=[NHM:GPU(usage)]
Postfix=" %"
X=([Background:W] - 10)
Y=0r
DynamicVariables=1

[Meter_NameSectionLabel]
Meter=String
MeterStyle=Text
Text=name (section variable):
X=10
Y=8R

[Meter_NameSectionValue]
Meter=String
MeterStyle=Text
StringAlign=Right
FontSize=11
Text=[NHM:GPU(name)]
X=([Background:W] - 10)
Y=0r
DynamicVariables=1

[Meter_Note]
Meter=String
MeterStyle=Text
Text=Lua-read values printed to log (About)
FontSize=10
FontColor=160,160,160,255
X=10
Y=20R
