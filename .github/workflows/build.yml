name: Build NativeHardwareMonitor

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # Win32 builds the x86 stub only (StubX86.cpp) - the vendor SDKs are x64,
    # but a .rmskin has to carry a 32-bit DLL or the installer rejects it.
    strategy:
      matrix:
        include:
          - platform: x64
            outdir: x64/Release
          - platform: Win32
            outdir: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild NativeHardwareMonitor.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /m

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativeHardwareMonitor-${{ matrix.platform }}
          path: |
            ${{ matrix.outdir }}/*.dll
            ${{ matrix.outdir }}/*.pdb
