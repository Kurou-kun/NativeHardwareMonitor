Category=Memory
Metric=total
Device=2
Debug=2

[Measure_Swap_Percent]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=usedpercent
Device=2
Debug=2


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background# | StrokeWidth 0
W=(340 * #scale#)
H=(561 * #scale#)
X=0
Y=0
AntiAlias=1
;   The Shape reads its own W/H back as section variables, so without this the
;   rectangle paints at whatever size it had last refresh.
DynamicVariables=1

    [Header]
    Meter=Shape
    Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background_alt# | StrokeWidth 0
    W=[Background:W]
    H=(25 * #scale#)
    X=0r
    Y=0r
    AntiAlias=1

        [Header_Title]
        Meter=String
        MeterStyle=Style_Header
        Text="memory"
        W=[Header:W]
        H=[Header:H]
        X=([Header:W] / 2)
        Y=0r


;   RAM
[Group_ram]
Meter=String
MeterStyle=Style_Group
Text="ram"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Meter_RAM_Used]
    Meter=String
    MeterStyle=Style_Label
    Text="ram used"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Meter_RAM_Used_Value]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_RAM_Used
        Text=%1
        AutoScale=1k
        NumOfDecimals=1
        Postfix="B"
        W=(([Background:W] / 2) - (5 * #scale#))
        H=(20 * #scale#)
        X=([Background:W] - (5 * #scale#))
