[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=NativeHardwareMonitor Example
Author=Kurou
Version=1.0.3
License=Creative Commons BY-NC-SA 4.0

[Variables]
plugin_name=NativeHardwareMonitor


;   WARNING
;
;   Plugin updates with skin update rate keep that in mind!
;
;
;   [Measure]
;   Measure=Plugin
;   Plugin=NativeHardwareMonitor
;   Category=Memory
;   Metric={value}  [Used, Free, Total, UsedPercent, Cached, Speed, MemoryType, Manufacturer, PartNumber, ModuleCount]
;   Device={value}  [0, 1, 2] which is [RAM, Virtual (commit charge), Swap (pagefile.sys)]
;   Debug={value}  [1, 0]
;
;   Cached is only meaningful on Device=0 (RAM) — it's a breakdown of physical
;   memory, not a separate pool like Virtual/Swap.
;
;   Speed/MemoryType/Manufacturer/PartNumber/ModuleCount describe the physical RAM
;   hardware — Device=0 only. Manufacturer may read "Unknown" if the modules'
;   SMBIOS data doesn't populate it (common); PartNumber is the reliable identifier.


;   MEASURES
[Measure_RAM_Used]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=used
Debug=2

[Measure_RAM_Free]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=free
Debug=2

[Measure_RAM_Total]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=total
Debug=2

[Measure_RAM_Percent]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=usedpercent
Debug=2

[Measure_RAM_Cached]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=cached
Debug=2

[Measure_RAM_Speed]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=speed
Debug=2

[Measure_RAM_Type]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=memorytype
Debug=2

[Measure_RAM_Manufacturer]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=manufacturer
Debug=2

[Measure_RAM_PartNumber]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=partnumber
Debug=2

[Measure_RAM_Modules]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=modulecount
Debug=2


[Measure_Virtual_Used]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=used
Device=1
Debug=2

[Measure_Virtual_Free]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=free
Device=1
Debug=2

[Measure_Virtual_Total]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=total
Device=1
Debug=2

[Measure_Virtual_Percent]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=usedpercent
Device=1
Debug=2


[Measure_Swap_Used]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=used
Device=2
Debug=2

[Measure_Swap_Free]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=free
Device=2
Debug=2

[Measure_Swap_Total]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=total
Device=2
Debug=2

[Measure_Swap_Percent]
Measure=Plugin
Plugin=#plugin_name#
Category=Memory
Metric=usedpercent
Device=2
Debug=2

;   STYLES
[Text]
AntiAlias=1
FontColor=250, 250, 250, 255
FontSize=14
FontFace=Roboto

;   METERS
[Background]
