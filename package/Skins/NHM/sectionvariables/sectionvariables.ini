[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=NativeHardwareMonitor Section Variables
Author=Kurou
Version=2.3.1
License=Creative Commons BY-NC-SA 4.0
Information=Every metric read twice - once through a measure of its own, once inline as a section variable through a single hub measure. The two columns must agree; a row where they disagree is a bug.


;   SECTION VARIABLES
;
;   [NHM:<Category>(<Metric>, <Device>)] reads any metric through one measure.
;   Device is optional and defaults to 0. Metric accepts the same names and
;   aliases as Metric= on a measure.
;
;   [NHM:GPU(temp)]  [NHM:GPU(name, 1)]  [NHM:CPU(usage)]  [NHM:GPU(count)]
;   [NHM:GPU(provider)]
;
;   Numbers print with up to three decimals, trailing zeros trimmed. A third
;   argument sets the decimals instead - [NHM:CPU(usage,,0)] rounds to a whole
;   number on device 0. There is no scaling: values arrive as bare numbers in
;   their raw base unit (bytes, hertz), which is the one form a skin can compute
;   with. Convert where the skin already does its arithmetic -
;
;     tonumber(SKIN:ReplaceVariables('[NHM:GPU("vramused",,15)]')) / 1073741824
;
;   Rainmeter's own formatting CANNOT reach a section variable that calls a
;   plugin: NumOfDecimals and AutoScale act on a measure's value, and
;   [NHM:GPU(vramused):/1048576] is not valid syntax - Rainmeter hands the whole
;   `GPU(...)` selector to the plugin and substitutes whatever string comes back.
;   A Calc measure takes it back if you want those options - see the wiki.
;
;   One function per category: GPU, CPU, Memory, Network, Storage, Ping,
;   Battery, System, Motherboard, Display.
;
;   Meter and measure OPTIONS need DynamicVariables=1 to re-resolve them.
;   ACTIONS do not - see the scroll actions on [Background] below.


[Variables]
device=0
plugin_name=NativeHardwareMonitor

;   IMPORTS
;   Palette, fonts and the shared styles. Keep this LAST in [Variables] -
;   the include opens style sections, so anything after it lands in one.
@Include_Styles="#@#Styles.inc"


;   Two deliberate deviations from the shared styles, kept local so the
;   include above stays the single source for everything else.
;
;   color_section marks the column read inline through the hub measure, so the
;   two read paths are told apart at a glance - that contrast is this skin's
;   whole point. And Style_Value needs ClipString=2 here, not 1: two value
;   columns sit side by side, and clipping to W AND H is what stops a long GPU
;   name wrapping onto a second line and shoving every row below it down.
[Variables]
color_section=130, 210, 255, 255

[Style_Value]
W=(115 * #scale#)
H=(20 * #scale#)
ClipString=2
X=(245 * #scale#)
Y=0r

[Style_Section]
FontFace=#font_family#
FontColor=#color_section#
FontSize=(#font_size_m# * #scale#)
StringAlign="Right"
W=(115 * #scale#)
H=(20 * #scale#)
ClipString=2
X=([Background:W] - (5 * #scale#))
Y=0r
DynamicVariables=1
AntiAlias=1


;   HUB MEASURE
;
;   No Category= at all: this measure has no reading of its own (it stays at 0)
;   and exists only to host the section variables above.
[NHM]
Measure=Plugin
Plugin=#plugin_name#


;   MEASURES - the same metrics the one-measure-per-metric way
[Measure_Usage]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=usage
Device=#device#
DynamicVariables=1

[Measure_Temperature]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=temperature
Device=#device#
DynamicVariables=1

[Measure_VramUsed]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=vramused
Device=#device#
DynamicVariables=1

[Measure_Name]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=name
Device=#device#
DynamicVariables=1

[Measure_Count]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=count

[Measure_ProviderStatus]
Measure=Plugin
Plugin=#plugin_name#
Category=GPU
Metric=providerstatus


;   METERS
[Background]
Meter=Shape
Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background# | StrokeWidth 0
W=(400 * #scale#)
H=(306 * #scale#)
X=0
Y=0
AntiAlias=1
;   Section variables in ACTIONS resolve without DynamicVariables=1 - only the
;   #device# variable here needs it. Clamping against [NHM:GPU(count)] is why the
;   device count is worth exposing: no hard-coded maximum.
;
;   The Max(0, ...) matters. If count is ever 0 - and it is, for the moment before
;   the first gather lands - then "count - 1" is -1, Clamp(x, 0, -1) returns -1, and
;   the skin asks for a device that cannot exist. Never let a count feed a clamp
;   bound without flooring it.
MouseScrollUpAction=[!SetVariable device "(Clamp(#device# + 1, 0, Max(0, [NHM:GPU(count)] - 1)))"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
MouseScrollDownAction=[!SetVariable device "(Clamp(#device# - 1, 0, Max(0, [NHM:GPU(count)] - 1)))"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
DynamicVariables=1

    [Header]
    Meter=Shape
    Shape=Rectangle 0, 0, [#CURRENTSECTION#:W], [#CURRENTSECTION#:H], 0 | Fill Color #color_background_alt# | StrokeWidth 0
    W=[Background:W]
    H=(25 * #scale#)
    X=0r
    Y=0r
    AntiAlias=1

        [Header_Title]
        Meter=String
        MeterStyle=Style_Header
        Text="section variables"
        W=[Header:W]
        H=[Header:H]
        X=([Header:W] / 2)
        Y=0r


;   GPU
[Group_Gpu]
Meter=String
MeterStyle=Style_Group
Text="gpu device #device# - scroll to change"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R
DynamicVariables=1

;   Column headings, so it is obvious which value came from which read path.
    [Column_Metric]
    Meter=String
    MeterStyle=Style_Wide
    Text="metric"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(18 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Column_Measure]
        Meter=String
        MeterStyle=Style_Wide
        StringAlign="Right"
        Text="measure"
        W=(115 * #scale#)
        H=(18 * #scale#)
        X=(245 * #scale#)
        Y=0r

        [Column_Section]
        Meter=String
        MeterStyle=Style_Wide
        StringAlign="Right"
        FontColor=#color_section#
        ;   NOT written as [NHM:...] - the style carries DynamicVariables=1, so
        ;   Rainmeter resolves that as a real section variable and prints 0.
        Text="inline"
        W=(115 * #scale#)
        H=(18 * #scale#)
        X=([Background:W] - (5 * #scale#))
        Y=0r

;   count - the one metric every category answers
    [Label_Count]
    Meter=String
    MeterStyle=Style_Label
    Text="count"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Value_CountMeasure]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Count
        Text=%1

        [Value_CountSection]
        Meter=String
        MeterStyle=Style_Section
        Text=[NHM:GPU(count)]

;   providerstatus - reserved in every category too. 1 gathering, 0 not up yet,
;   -1 no provider on this machine. This is what tells a skin whether a -1
;   elsewhere means "sensor absent" or "no driver installed" - show a message,
;   not a number.
    [Label_ProviderStatus]
    Meter=String
    MeterStyle=Style_Label
    Text="provider"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Value_ProviderStatusMeasure]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_ProviderStatus
        Text=%1

        [Value_ProviderStatusSection]
        Meter=String
        MeterStyle=Style_Section
        Text=[NHM:GPU(provider)]

    [Label_Usage]
    Meter=String
    MeterStyle=Style_Label
    Text="usage"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Value_UsageMeasure]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Usage
        Text=%1
        NumOfDecimals=1

        [Value_UsageSection]
        Meter=String
        MeterStyle=Style_Section
        Text=[NHM:GPU(usage, #device#)]

    [Label_Temperature]
    Meter=String
    MeterStyle=Style_Label
    Text="temperature"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Value_TemperatureMeasure]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Temperature
        Text=%1
        NumOfDecimals=1

        [Value_TemperatureSection]
        Meter=String
        MeterStyle=Style_Section
        Text=[NHM:GPU(temp, #device#)]

;   vramused - a big number, checks the value is not printed in exponent form
    [Label_VramUsed]
    Meter=String
    MeterStyle=Style_Label
    Text="vramused"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Value_VramUsedMeasure]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_VramUsed
        Text=%1

        [Value_VramUsedSection]
        Meter=String
        MeterStyle=Style_Section
        Text=[NHM:GPU(vramused, #device#)]

;   name - a string metric, not a number
    [Label_Name]
    Meter=String
    MeterStyle=Style_Label
    Text="name"
    W=(([Background:W] / 2) - (5 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R

        [Value_NameMeasure]
        Meter=String
        MeterStyle=Style_Value
        MeasureName=Measure_Name
        FontSize=(#font_size_s# * #scale#)
        Text=%1

        [Value_NameSection]
        Meter=String
        MeterStyle=Style_Section
        FontSize=(#font_size_s# * #scale#)
        Text=[NHM:GPU(name, #device#)]


;   OTHER CATEGORIES
;   No extra measures needed for any of these - that is the point.
[Group_Others]
Meter=String
MeterStyle=Style_Group
Text="other categories, no measures"
W=[Background:W]
H=(22 * #scale#)
X=(5 * #scale#)
Y=(8 * #scale#)R

    [Value_Others]
    Meter=String
    MeterStyle=Style_Section
    StringAlign="Left"
    W=([Background:W] - (10 * #scale#))
    H=(20 * #scale#)
    X=(5 * #scale#)
    Y=(2 * #scale#)R
    Text=[NHM:CPU(usage,,0)] % cpu  /  [NHM:Memory(usedpercent,,0)] % ram  /  [NHM:Display(count)] displays
